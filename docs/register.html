<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SaaS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <h2 class="auth-title">Create account</h2>
      <p class="auth-subtitle">You will be the admin of your organization.</p>

      <div class="form-group">
        <label for="org">Organization Name</label>
        <input id="org" type="text" placeholder="e.g. Acme Corp" autocomplete="organization">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="name@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a strong password" autocomplete="new-password"
          onkeypress="if(event.key==='Enter')register()">
      </div>

      <button class="btn-primary" onclick="register()">Create Account</button>

      <p id="error" class="error-message text-center" style="margin-top: 1rem;"></p>

      <div class="divider"></div>

      <p class="text-center text-muted mb-0" style="font-size: 0.875rem;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
