<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - SaaS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Projects</h1>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 1.25rem;">New Project</h3>
      <div class="input-row">
        <div class="form-group" style="flex: 2;">
          <label for="projectName">Project Name</label>
          <input id="projectName" type="text" placeholder="e.g. Website Redesign"
            onkeypress="if(event.key==='Enter')createProject()">
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="projectStatus">Status</label>
          <select id="projectStatus">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
        <button id="createBtn" class="btn-primary btn-inline" onclick="createProject()"
          style="align-self: flex-end;">Create</button>
      </div>
      <p id="createError" class="error-message"></p>
    </div>

    <div id="loadingState" class="state-message" style="display: none;">
      <p>Loading projects...</p>
    </div>

    <p id="empty" class="state-message" style="display: none;"></p>

    <ul id="projectList" class="project-list"></ul>
  </div>

  <script src="app.js"></script>
</body>

</html>
