<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SaaS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="name@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"
          onkeypress="if(event.key==='Enter')login()">
      </div>

      <button class="btn-primary" onclick="login()">Sign In</button>

      <p id="error" class="error-message text-center" style="margin-top: 1rem;"></p>

      <div class="divider"></div>

      <p class="text-center text-muted mb-0" style="font-size: 0.875rem;">
        No account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
